########################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault


###########################################
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-role
  namespace: vault

rules:
- apiGroups: [""]
  resources:
    - pods
    - secrets
    - services
    - configmaps
  verbs:
    - get
    - list
    - watch


#######################################
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-rolebinding
  namespace: vault

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-role

subjects:
- kind: ServiceAccount
  name: vault
  namespace: vault

################################################
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator

subjects:
- kind: ServiceAccount
  name: vault
  namespace: vault

